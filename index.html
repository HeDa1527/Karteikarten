<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232325" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Karteikasten</title>
<style>
:root{
  --bg:#ffffff; --fg:#111; --muted:#6b6b6b; --line:#dcdcdc; --bar:#f6f6f6; --btn:#ececec; --btn-fg:#111;
  --new:#1d4ed8; --learn:#c62828; --review:#2e7d32; --zero:#b5b5b5;
  --again:#c62828; --hard:#5f6368; --good:#2e7d32; --easy:#1d4ed8;
  --accent:#1d4ed8; --cloze:#0000ff; --danger:#c62828; --sheet:#ffffff;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2c2c2c; --fg:#eeeeee; --muted:#a0a0a0; --line:#444; --bar:#232325; --btn:#3d3d3f; --btn-fg:#eee;
    --new:#6aa2ff; --learn:#ff6b6b; --review:#6fcf73; --zero:#666;
    --again:#ff6b6b; --hard:#c4c4c4; --good:#6fcf73; --easy:#6aa2ff;
    --accent:#6aa2ff; --cloze:#87cefa; --danger:#ff6b6b; --sheet:#333335;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;background:var(--bar);border-bottom:1px solid var(--line);
  padding:calc(8px + var(--safe-t)) 12px 8px;min-height:48px}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar:not(.bottom){padding-left:max(12px, env(safe-area-inset-left));padding-right:max(12px, env(safe-area-inset-right))}
/* iPad: Platz für die Fenster-Knöpfe (Schließen/Vergrößern) oben links */
@media (min-width: 600px){
  .bar:not(.bottom){padding-left:max(88px, env(safe-area-inset-left))}
}
.bar.bottom{border-top:1px solid var(--line);border-bottom:0;padding:8px 12px calc(8px + var(--safe-b));justify-content:space-around}
.tb{color:var(--accent);padding:6px 8px;border-radius:8px;white-space:nowrap;min-width:44px;min-height:36px}
.tb.strong{font-weight:600}
.tb:active{background:var(--btn)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 32px}

/* Deckliste wie in Anki: Deck | Neu | Lernen | Fällig */
table.decks{width:100%;border-collapse:collapse;max-width:760px;margin:0 auto}
.decks th{font-size:13px;font-weight:600;color:var(--muted);text-align:right;padding:10px 8px 6px;border-bottom:1px solid var(--line)}
.decks th:first-child{text-align:left;padding-left:16px}
.decks td{padding:0;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.decks td.name{text-align:left}
.decks td.name button{display:block;width:100%;text-align:left;padding:14px 8px 14px 16px;font-size:17px}
.decks td.n{color:var(--new);padding:0 8px;width:58px}
.decks td.l{color:var(--learn);padding:0 8px;width:62px}
.decks td.r{color:var(--review);padding:0 8px;width:58px}
.decks td.z{color:var(--zero)}
.decks td.gear button{padding:12px 14px 12px 6px;color:var(--muted);font-size:18px}
.decks tr:active td{background:var(--btn)}
.empty{color:var(--muted);text-align:center;padding:40px 24px}

/* Lernansicht */
.counts{flex:1;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.counts span{padding:0 2px}
.counts .cn{color:var(--new)} .counts .cl{color:var(--learn)} .counts .cr{color:var(--review)}
.counts .cur{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.card{font-family:arial,sans-serif;font-size:20px;text-align:center;color:var(--fg);padding:20px 16px 40px;
  max-width:820px;margin:0 auto;overflow-wrap:anywhere}
.card img{max-width:100%;height:auto}
.card hr#answer{border:0;border-top:1px solid var(--line);margin:18px 0}
.cloze{font-weight:bold;color:var(--cloze)}
.answerbar{background:var(--bar);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b))}
.showbtn{display:block;width:100%;max-width:520px;margin:0 auto;background:var(--btn);color:var(--btn-fg);
  border-radius:10px;padding:14px;font-size:17px}
.grades{display:flex;gap:6px;max-width:620px;margin:0 auto}
.grades button{flex:1;background:var(--btn);border-radius:10px;padding:6px 2px 10px;display:flex;flex-direction:column;align-items:center}
.grades small{font-size:12px;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.grades span{font-size:16px;font-weight:600}
.g1 span{color:var(--again)} .g2 span{color:var(--hard)} .g3 span{color:var(--good)} .g4 span{color:var(--easy)}
.grades button:active,.showbtn:active{filter:brightness(.92)}
.done{padding:48px 24px;text-align:center}
.done h2{font-size:20px;margin:0 0 10px}
.done p{color:var(--muted);margin:6px 0}

/* Formulare */
.form label.lb{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.field{min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none;background:var(--bg);
  font-family:arial,sans-serif;font-size:18px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.field:focus{border-color:var(--accent)}
.field img{max-width:100%;height:auto;vertical-align:middle}
.field:empty::before{content:attr(data-ph);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tools button{background:var(--btn);border-radius:8px;padding:8px 12px;min-height:38px}
.tools .clz{display:none}
.is-cloze .tools .clz{display:inline-block}
.preview{border:1px dashed var(--line);border-radius:10px;margin-top:6px;padding:12px}
h3{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.btn{display:block;width:100%;background:var(--btn);color:var(--btn-fg);border-radius:10px;padding:12px;margin-top:10px;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
a.btn{text-decoration:none}
.note{font-size:14px;color:var(--muted);margin:6px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.04em;background:var(--btn);padding:10px;border-radius:8px;text-align:center;-webkit-user-select:all;user-select:all}
.list{list-style:none;margin:0;padding:0}
.list li button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s{display:block;font-size:13px;color:var(--muted)}
.search{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.search select{width:40%}

/* Bottom-Sheet für Deck-Optionen */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:14px 14px 0 0;
  padding:16px 16px calc(16px + var(--safe-b));max-width:620px;margin:0 auto;max-height:90%;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:18px;text-align:center}

#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--learn);margin-left:4px;vertical-align:middle;visibility:hidden}
.syncdot.on{visibility:visible}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== Deckliste ===== -->
<section class="view on" id="v-decks">
  <header class="bar">
    <button class="tb" id="btn-sync"><span id="sync-ic">⟳</span> Sync<span class="syncdot" id="sync-dot"></span></button>
    <h1>Decks</h1>
    <button class="tb strong" id="btn-add" aria-label="Karte hinzufügen" style="font-size:22px">＋</button>
  </header>
  <main class="scroll">
    <table class="decks">
      <thead><tr><th>Deck</th><th>Neu</th><th>Lernen</th><th>Fällig</th><th></th></tr></thead>
      <tbody id="deck-rows"></tbody>
    </table>
    <div class="empty" id="decks-empty" hidden>
      Noch keine Decks.<br>Tippe auf <b>＋</b>, um deine erste Karte anzulegen,<br>oder verbinde in den Einstellungen ein zweites Gerät.
    </div>
  </main>
  <footer class="bar bottom">
    <button class="tb" id="btn-newdeck">Deck erstellen</button>
    <button class="tb" id="btn-browse">Durchsuchen</button>
    <button class="tb" id="btn-settings">Einstellungen</button>
  </footer>
</section>

<!-- ===== Lernen ===== -->
<section class="view" id="v-review">
  <header class="bar">
    <button class="tb" id="rv-back">‹ Decks</button>
    <div class="counts" id="rv-counts"></div>
    <button class="tb" id="rv-undo" aria-label="Rückgängig">↶</button>
    <button class="tb" id="rv-edit" aria-label="Bearbeiten">Bearb.</button>
  </header>
  <main class="scroll" id="rv-scroll"><div class="card" id="rv-card"></div></main>
  <footer class="answerbar" id="rv-bottom"></footer>
</section>

<!-- ===== Hinzufügen / Bearbeiten ===== -->
<section class="view" id="v-edit">
  <header class="bar">
    <button class="tb" id="ed-cancel">Abbrechen</button>
    <h1 id="ed-title">Hinzufügen</h1>
    <button class="tb strong" id="ed-save">Hinzufügen</button>
  </header>
  <main class="scroll"><div class="wrap form" id="ed-form">
    <div class="row">
      <div><label class="lb">Typ</label>
        <select id="ed-type">
          <option value="basic">Basis</option>
          <option value="reverse">Basis (mit Umkehrkarte)</option>
          <option value="cloze">Lückentext</option>
        </select></div>
      <div><label class="lb">Deck</label><select id="ed-deck"></select></div>
    </div>
    <div class="tools" id="ed-tools">
      <button data-t="bold"><b>F</b></button>
      <button data-t="italic"><i>K</i></button>
      <button data-t="underline"><u>U</u></button>
      <button data-t="paste">Einfügen aus Zwischenablage</button>
      <button data-t="img">Foto/Bild</button>
      <button data-t="cloze" class="clz">[…]</button>
      <button data-t="cloze-same" class="clz">[…] gleiche Nr.</button>
    </div>
    <label class="lb" id="ed-l0">Vorderseite</label>
    <div class="field" id="ed-f0" contenteditable="true" data-ph="Frage"></div>
    <label class="lb" id="ed-l1">Rückseite</label>
    <div class="field" id="ed-f1" contenteditable="true" data-ph="Antwort"></div>
    <p class="note" id="ed-hint"></p>
    <h3>Vorschau</h3>
    <div class="card preview" id="ed-prev"></div>
    <button class="btn danger" id="ed-del" hidden>Notiz löschen</button>
    <input type="file" id="ed-file" accept="image/*" hidden>
  </div></main>
</section>

<!-- ===== Durchsuchen ===== -->
<section class="view" id="v-browse">
  <header class="bar">
    <button class="tb" id="br-back">‹ Decks</button>
    <h1>Durchsuchen</h1>
    <button class="tb strong" id="br-add" style="font-size:22px">＋</button>
  </header>
  <div class="search">
    <input id="br-q" type="search" placeholder="Suchen …" autocomplete="off">
    <select id="br-deck"></select>
  </div>
  <main class="scroll"><ul class="list" id="br-list"></ul><div class="empty" id="br-empty" hidden>Keine Karten gefunden.</div></main>
</section>

<!-- ===== Einstellungen ===== -->
<section class="view" id="v-settings">
  <header class="bar">
    <button class="tb" id="st-back">‹ Decks</button>
    <h1>Einstellungen</h1>
    <span style="min-width:60px"></span>
  </header>
  <main class="scroll"><div class="wrap" id="st-body"></div></main>
</section>

<!-- Deck-Optionen -->
<div class="sheet-bg" id="sheet-bg"><div class="sheet form" id="sheet"></div></div>
<div id="toast"></div>

<script src="fsrs.js"></script>
<script>
'use strict';
const APP_VERSION = '5';
/* ================= Hilfsfunktionen ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(10))].map((b) => b.toString(36).padStart(2, '0')).join('');
const DAY = 864e5;
let toastT;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

/* ================= Datenbank (IndexedDB) ================= */
const db = {
  h: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('karteikasten', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('rec', { keyPath: 'id' });
        d.createObjectStore('img', { keyPath: 'id' });
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => { this.h = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.h.transaction(store, mode), s = t.objectStore(store);
      let out; const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', (st) => st.getAll()); },
  get(s, k) { return this.tx(s, 'readonly', (st) => st.get(k)); },
  put(s, v) { return this.tx(s, 'readwrite', (st) => st.put(v)); },
  putMany(s, vs) { return this.tx(s, 'readwrite', (st) => { vs.forEach((v) => st.put(v)); }); },
  del(s, k) { return this.tx(s, 'readwrite', (st) => st.delete(k)); },
};
const getMeta = async (k, d = null) => { const r = await db.get('meta', k); return r ? r.v : d; };
const setMeta = (k, v) => db.put('meta', { k, v });

/* ================= Zustand ================= */
const S = {
  recs: new Map(),      // alle Datensätze: deck, note, card, conf
  imgUrls: new Map(),   // Bild-ID -> Object-URL
  pendingImg: 0,
  deck: null, cur: null, shown: false, undo: null, sinceNew: 0,
  rt: null, at: null, atExp: 0, syncing: false, view: 'decks', editRet: 'decks',
};
const live = (r) => r && !r.del;
const all = (kind) => { const o = []; for (const r of S.recs.values()) if (r.kind === kind && live(r)) o.push(r); return o; };
const decks = () => all('deck').sort((a, b) => a.name.localeCompare(b.name, 'de', { numeric: true }));
const conf = () => S.recs.get('conf') || { id: 'conf', kind: 'conf', retention: 0.9 };

function save(rec) {
  rec.u = Math.max(Date.now(), (rec.u || 0) + 1);
  rec.d = 1;
  S.recs.set(rec.id, rec);
  db.put('rec', rec);
  syncUI(); autoSyncSoon();
}

function deckCards(deckId) {
  const out = [];
  for (const c of S.recs.values()) {
    if (c.kind !== 'card' || c.del) continue;
    const n = S.recs.get(c.note);
    if (live(n) && n.deck === deckId) out.push(c);
  }
  return out;
}
const noteCardsAll = (noteId) => [...S.recs.values()].filter((c) => c.kind === 'card' && c.note === noteId);

/* ================= Planung (FSRS, wie in Anki) ================= */
let F = null;
function sched() {
  const r = conf().retention || 0.9;
  if (!F || F._r !== r) {
    F = FSRS.fsrs({ request_retention: r, enable_fuzz: true, maximum_interval: 36500,
      learning_steps: ['1m', '10m'], relearning_steps: ['10m'] });
    F._r = r;
  }
  return F;
}
const st = (c) => (c.fs ? c.fs.state : 0);          // 0 neu, 1 lernen, 2 wiederholen, 3 neu lernen
const due = (c) => (c.fs ? c.fs.due : 0);
const toF = (fs, now) => fs
  ? { ...fs, due: new Date(fs.due), last_review: fs.last_review ? new Date(fs.last_review) : undefined }
  : FSRS.createEmptyCard(now);
const fromF = (c) => ({ due: +c.due, stability: c.stability, difficulty: c.difficulty, scheduled_days: c.scheduled_days,
  reps: c.reps, lapses: c.lapses, learning_steps: c.learning_steps, state: c.state, last_review: c.last_review ? +c.last_review : null });

// Anki-Tag beginnt um 4 Uhr morgens
function dayStart(now = Date.now()) {
  const d = new Date(now); d.setHours(4, 0, 0, 0);
  if (d.getTime() > now) d.setDate(d.getDate() - 1);
  return d.getTime();
}

function queues(deck, now = Date.now()) {
  const ds = dayStart(now), de = ds + DAY;
  let introduced = 0, reviewed = 0;
  const nw = [], lrn = [], rev = [];
  for (const c of deckCards(deck.id)) {
    const s = st(c);
    if (c.intro >= ds) introduced++;
    else if (c.fs && c.fs.last_review >= ds) reviewed++;
    if (s === 0) nw.push(c);
    else if (s === 2) { if (c.fs.due < de) rev.push(c); }
    else lrn.push(c);
  }
  nw.sort((a, b) => (a.c || 0) - (b.c || 0) || a.ord - b.ord);
  rev.sort((a, b) => due(a) - due(b));
  lrn.sort((a, b) => due(a) - due(b));
  const newLeft = Math.max(0, (deck.newPerDay ?? 20) - introduced);
  const revLeft = Math.max(0, (deck.revPerDay ?? 200) - reviewed);
  return { nw: nw.slice(0, newLeft), rev: rev.slice(0, revLeft), lrn, lrnToday: lrn.filter((c) => due(c) < de) };
}

function pickNext(deck) {
  const now = Date.now(), q = queues(deck, now);
  const ln = q.lrn.find((c) => due(c) <= now);
  if (ln) return { c: ln, q: 'l', qs: q };
  if (q.rev.length || q.nw.length) {
    let useNew = !q.rev.length;
    if (!useNew && q.nw.length) useNew = S.sinceNew >= Math.max(1, Math.floor(q.rev.length / q.nw.length));
    return useNew ? { c: q.nw[0], q: 'n', qs: q } : { c: q.rev[0], q: 'r', qs: q };
  }
  const ahead = q.lrn.find((c) => due(c) <= now + 20 * 60e3); // Anki: 20 Min. vorauslernen
  if (ahead) return { c: ahead, q: 'l', qs: q };
  return { c: null, qs: q };
}

function fmtIv(ms) {
  const m = ms / 60e3, h = m / 60, d = h / 24, f = (x) => x.toLocaleString('de-DE', { maximumFractionDigits: 1 });
  if (m < 1) return '<1 Min.';
  if (m < 60) return Math.round(m) + ' Min.';
  if (h < 24) return Math.round(h) + ' Std.';
  if (d < 30) return Math.round(d) + ' T.';
  if (d < 365) return f(d / 30) + ' Mon.';
  return f(d / 365) + ' J.';
}

/* ================= Karten darstellen ================= */
const CLOZE_RE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
function clozeNums(html) { const s = new Set(); for (const m of String(html).matchAll(CLOZE_RE)) s.add(+m[1]); return [...s].sort((a, b) => a - b); }
function clozeRender(html, n, reveal) {
  return String(html).replace(CLOZE_RE, (_, num, content, hint) => {
    if (+num !== n) return content;
    if (reveal) return `<span class="cloze">${content}</span>`;
    return `<span class="cloze">[${hint ? esc(hint) : '…'}]</span>`;
  });
}
function requiredOrds(type, f0) {
  if (type === 'basic') return [0];
  if (type === 'reverse') return [0, 1];
  return clozeNums(f0).map((n) => n - 1);
}
function renderCard(note, ord, answer) {
  const [f0, f1] = note.f;
  if (note.type === 'cloze') {
    const q = clozeRender(f0, ord + 1, answer);
    return answer && (stripHtml(f1) || /<img/i.test(f1)) ? q + '<br><br>' + f1 : q;
  }
  const front = note.type === 'reverse' && ord === 1 ? f1 : f0;
  const back = note.type === 'reverse' && ord === 1 ? f0 : f1;
  return answer ? front + '<hr id="answer">' + back : front;
}
function stripHtml(h) { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').trim(); }

/* ================= Bilder ================= */
async function imgUrl(id) {
  if (S.imgUrls.has(id)) return S.imgUrls.get(id);
  const r = await db.get('img', id);
  if (r) { const u = URL.createObjectURL(r.blob); S.imgUrls.set(id, u); return u; }
  if (S.rt && navigator.onLine) {
    try {
      const b = await dbxImage(id);
      if (b) {
        await db.put('img', { id, blob: b, synced: true });
        const u = URL.createObjectURL(b); S.imgUrls.set(id, u); return u;
      }
    } catch {}
  }
  return null;
}
function hydrate(el) {
  el.querySelectorAll('img[data-img]').forEach(async (im) => {
    const u = await imgUrl(im.dataset.img);
    if (u) im.src = u; else im.alt = '(Bild noch nicht geladen)';
  });
}
// Bild verkleinern; Handschrift (transparent) wird auf Weiß gelegt und als PNG behalten
async function prepImage(blob, kind) {
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const max = kind === 'photo' ? 1600 : 2000;
    let w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
    const type = kind === 'photo' ? 'image/jpeg' : 'image/png';
    let out = await new Promise((r) => cv.toBlob(r, type, 0.85));
    if (type === 'image/png' && out.size > 1_500_000) out = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.9));
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function storeImage(blob, kind) {
  const b = await prepImage(blob, kind);
  const id = uid();
  await db.put('img', { id, blob: b, synced: false });
  S.imgUrls.set(id, URL.createObjectURL(b));
  S.pendingImg++; syncUI();
  return id;
}

/* ================= HTML säubern (wie Anki: einfache Formatierung + Bilder) ================= */
const OK_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'DIV', 'P', 'SPAN', 'UL', 'OL', 'LI', 'SUB', 'SUP', 'IMG']);
function clean(html) {
  const t = document.createElement('template'); t.innerHTML = html;
  const walk = (node) => {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 8) { ch.remove(); continue; }
      if (ch.nodeType !== 1) continue;
      const tag = ch.tagName;
      if (['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'HEAD', 'IFRAME', 'OBJECT'].includes(tag)) { ch.remove(); continue; }
      if (!OK_TAGS.has(tag)) { walk(ch); ch.replaceWith(...ch.childNodes); continue; }
      if (tag === 'IMG') {
        const id = ch.getAttribute('data-img');
        if (!id || !/^[A-Za-z0-9_-]{1,64}$/.test(id)) { ch.remove(); continue; }
        [...ch.attributes].forEach((a) => ch.removeAttribute(a.name));
        ch.setAttribute('data-img', id);
        continue;
      }
      [...ch.attributes].forEach((a) => ch.removeAttribute(a.name));
      walk(ch);
    }
  };
  walk(t.content);
  return t.innerHTML.replace(/(<br>\s*)+$/i, '').trim();
}
// Gespeichertes HTML -> Editor (Bilder sichtbar machen)
function toEditor(el, html) { el.innerHTML = html || ''; hydrate(el); }
function fromEditor(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('img').forEach((im) => { if (!im.dataset.img) im.remove(); else im.removeAttribute('src'); });
  return clean(c.innerHTML);
}

// Einfügen (z. B. Lasso-Auswahl aus GoodNotes): Bild aus der Zwischenablage abfangen
async function onPaste(e) {
  const dt = e.clipboardData; if (!dt) return;
  const files = [...(dt.files || [])].filter((f) => f.type.startsWith('image/'));
  if (!files.length) for (const it of dt.items || []) if (it.kind === 'file' && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) files.push(f); }
  if (files.length) {
    e.preventDefault();
    for (const f of files) await insertImageBlob(f, 'paste');
    return;
  }
  const html = dt.getData('text/html');
  if (html) {
    e.preventDefault();
    // eingebettete Bilder (data:-URLs) übernehmen
    const t = document.createElement('template'); t.innerHTML = html;
    for (const im of [...t.content.querySelectorAll('img')]) {
      const src = im.getAttribute('src') || '';
      if (src.startsWith('data:image/')) {
        try { const b = await (await fetch(src)).blob(); const id = await storeImage(b, 'paste'); im.setAttribute('data-img', id); im.setAttribute('src', S.imgUrls.get(id)); }
        catch { im.remove(); }
      } else im.remove();
    }
    const cleaned = clean(t.innerHTML);
    insertHtml(cleaned.replace(/<img data-img="([^"]+)">/g, (m, id) => `<img data-img="${id}" src="${S.imgUrls.get(id) || ''}">`));
    return;
  }
  const txt = dt.getData('text/plain');
  if (txt) { e.preventDefault(); insertHtml(esc(txt).replace(/\n/g, '<br>')); }
}
// Zweiter Weg: Zwischenablage aktiv auslesen
async function pasteFromClipboard() {
  if (!navigator.clipboard || !navigator.clipboard.read) { toast('Bitte im Feld lange tippen → „Einsetzen“'); restoreSel(); return; }
  try {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      const t = it.types.find((x) => x.startsWith('image/'));
      if (t) { await insertImageBlob(await it.getType(t), 'paste'); return; }
    }
    for (const it of items) {
      if (it.types.includes('text/html')) { const h = await (await it.getType('text/html')).text(); insertHtml(clean(h).replace(/<img[^>]*>/g, '')); return; }
      if (it.types.includes('text/plain')) { const x = await (await it.getType('text/plain')).text(); insertHtml(esc(x).replace(/\n/g, '<br>')); return; }
    }
    toast('In der Zwischenablage ist nichts Passendes.');
  } catch (e) { toast('Kein Zugriff auf die Zwischenablage – bitte im Feld lange tippen → „Einsetzen“', 3500); }
}

  if (lastField !== F0) { F0.focus(); }
  document.execCommand('insertHTML', false, `{{c${n}::${inner}}}`);
  updatePreview();
}

function renderBrowse() {

function listBrowse() {
  const q = $('#br-q').value.trim().toLowerCase(), dk = $('#br-deck').value;
  const notes = all('note').filter((n) => (!dk || n.deck === dk)).sort((a, b) => (b.c || 0) - (a.c || 0));
  const rows = [];
  for (const n of notes) {
    const t0 = stripHtml(n.f[0]), t1 = stripHtml(n.f[1]);
    if (q && !(t0 + ' ' + t1).toLowerCase().includes(q)) continue;
    const cards = noteCardsAll(n.id).filter(live);
    const d = S.recs.get(n.deck);
    const nextDue = cards.filter((c) => c.fs).map(due).sort((a, b) => a - b)[0];
    const info = cards.every((c) => !c.fs) ? 'neu' : 'fällig ' + new Date(nextDue).toLocaleDateString('de-DE');
    const title = t0.replace(CLOZE_RE, '$2') || (/<img/.test(n.f[0]) ? '[Bild]' : '–');
    rows.push(`<li><button data-id="${n.id}"><span class="t">${esc(title.slice(0, 120))}</span>
      <span class="s">${esc(d ? d.name : '')} · ${cards.length} Karte${cards.length === 1 ? '' : 'n'} · ${info}</span></button></li>`);
    if (rows.length >= 300) break;
  }
  $('#br-list').innerHTML = rows.join('');
  $('#br-empty').hidden = rows.length > 0;
}
$('#br-q').oninput = listBrowse;
$('#br-deck').onchange = () => { S.browseDeck = $('#br-deck').value; listBrowse(); };
$('#br-list').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) openEditor(S.recs.get(b.dataset.id), 'browse'); });
$('#br-back').onclick = () => go('decks');
$('#br-add').onclick = () => { if (S.browseDeck) S.lastDeck = S.browseDeck; openEditor(null, 'browse'); };

/* ================= Sync über Dropbox (iPad ↔ iPhone) ================= */
const DBX_KEY = 'esocz1p5ge9zz3s';
const DBX = {
  auth: 'https://www.dropbox.com/oauth2/authorize',
  token: 'https://api.dropboxapi.com/oauth2/token',
  api: 'https://api.dropboxapi.com/2/',
  content: 'https://content.dropboxapi.com/2/',
};
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const hasDirty = () => S.pendingImg > 0 || [...S.recs.values()].some((r) => r.d);
function syncUI() {
  $('#sync-dot').classList.toggle('on', hasDirty());
  $('#sync-ic').classList.toggle('spin', S.syncing);
}
let autoT;
function autoSyncSoon() { if (!S.rt) return; clearTimeout(autoT); autoT = setTimeout(() => { if (S.view !== 'review') sync(false); }, 15000); }

async function authUrl() {
  let v = await getMeta('pkce');
  if (!v) { v = b64url(crypto.getRandomValues(new Uint8Array(48))); await setMeta('pkce', v); }
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  return DBX.auth + '?' + new URLSearchParams({ client_id: DBX_KEY, response_type: 'code', code_challenge: ch,
    code_challenge_method: 'S256', token_access_type: 'offline' });
}
async function finishAuth(code) {
  const v = await getMeta('pkce');
  const r = await fetch(DBX.token, { method: 'POST', body: new URLSearchParams({ code, grant_type: 'authorization_code', code_verifier: v, client_id: DBX_KEY }) });
  if (!r.ok) throw new Error('Code ungültig oder abgelaufen – bitte neu bei Dropbox anmelden');
  const j = await r.json();
  S.rt = j.refresh_token; S.at = j.access_token; S.atExp = Date.now() + ((j.expires_in || 14400) - 60) * 1000;
  await setMeta('rt', S.rt); await setMeta('pkce', null);
}
async function token() {
  if (S.at && Date.now() < S.atExp) return S.at;
  const r = await fetch(DBX.token, { method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: S.rt, client_id: DBX_KEY }) });
  if (!r.ok) throw new Error(r.status === 400 || r.status === 401 ? 'Dropbox-Anmeldung abgelaufen – bitte in den Einstellungen neu verbinden' : 'Dropbox nicht erreichbar');
  const j = await r.json();
  S.at = j.access_token; S.atExp = Date.now() + ((j.expires_in || 14400) - 60) * 1000;
  return S.at;
}
async function dbx(kind, ep, arg, body, retry = true) {
  const h = { Authorization: 'Bearer ' + (await token()) };
  let opt;
  if (kind === 'api') { h['Content-Type'] = 'application/json'; opt = { method: 'POST', headers: h, body: JSON.stringify(arg) }; }
  else {
    h['Dropbox-API-Arg'] = JSON.stringify(arg);
    if (body !== undefined) h['Content-Type'] = 'application/octet-stream';
    opt = { method: 'POST', headers: h, body };
  }
  const r = await fetch(DBX[kind] + ep, opt);
  if (r.status === 401 && retry) { S.at = null; return dbx(kind, ep, arg, body, false); }
  return r;
}
async function readErr(r) {
  let raw = ''; try { raw = await r.text(); } catch {}
  let sum = ''; try { sum = JSON.parse(raw).error_summary || ''; } catch {}
  return { status: r.status, raw: raw.slice(0, 500), sum };
}
class DbxError extends Error {}
async function fail(step, r) {
  const e = await readErr(r);
  const detail = `${step} · HTTP ${e.status} · ${e.raw || '(leer)'}`;
  await setMeta('lastErr', new Date().toLocaleString('de-DE') + ' · ' + detail);
  const msg = /missing_scope/.test(e.raw) ? 'Dropbox-Berechtigungen fehlen (siehe Anleitung, dann neu verbinden)' : `${step}: ${e.sum || 'HTTP ' + e.status}`;
  throw new DbxError(msg);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Hochladen mit Wiederholung bei vorübergehenden Fehlern („other“, 429, 5xx)
async function upload(arg, bytes) {
  let r;
  for (let i = 0; i < 3; i++) {
    r = await dbx('content', 'files/upload', arg, bytes);
    if (r.ok) return r;
    if (r.status === 409) {
      const t = await r.clone().text();
      if (!/"other"|other\//.test(t)) return r; // echter Konflikt o. Ä. → Aufrufer entscheidet
    } else if (!(r.status === 429 || r.status >= 500)) return r;
    await sleep(800 * (i + 1));
  }
  return r;
}
const sniff = (u8) => (u8[0] === 0x89 && u8[1] === 0x50 ? 'image/png' : u8[0] === 0xff && u8[1] === 0xd8 ? 'image/jpeg' : u8[0] === 0x47 ? 'image/gif' : 'image/webp');
async function dbxImage(id) {
  const r = await dbx('content', 'files/download', { path: '/img/' + id });
  if (!r.ok) return null;
  const buf = await r.arrayBuffer();
  return new Blob([buf], { type: sniff(new Uint8Array(buf, 0, 4)) });
}

async function sync(manual) {
  if (!S.rt) { if (manual) { toast('Erst in den Einstellungen mit Dropbox verbinden.'); go('settings'); } return; }
  if (S.syncing) return;
  if (!navigator.onLine) { if (manual) toast('Keine Internetverbindung'); return; }
  S.syncing = true; syncUI();
  try {
    // 1) neue Bilder hochladen
    for (const im of await db.all('img')) {
      if (im.synced) continue;
      const bytes = new Uint8Array(await im.blob.arrayBuffer());
      const r = await upload({ path: '/img/' + im.id, mode: 'add', autorename: false, mute: true }, bytes);
      if (!r.ok) {
        const t = await r.clone().text();
        if (!(r.status === 409 && /conflict/.test(t))) await fail('Bild hochladen', r); // conflict = schon vorhanden
      }
      im.synced = true; await db.put('img', im);
      S.pendingImg = Math.max(0, S.pendingImg - 1);
    }
    S.pendingImg = 0;
    // 2) data.json abgleichen: holen, zusammenführen, zurückschreiben (mit Konfliktschutz)
    let got = 0;
    for (let tries = 0; ; tries++) {
      let rev = null;
      const m = await dbx('api', 'files/get_metadata', { path: '/data.json' });
      if (m.ok) rev = (await m.json()).rev;
      else if (!(m.status === 409 && /not_found/.test(await m.clone().text()))) await fail('Daten prüfen', m);
      if (rev && rev !== (await getMeta('rev'))) {
        const d = await dbx('content', 'files/download', { path: '/data.json' });
        if (!d.ok) await fail('Daten laden', d);
        try { rev = JSON.parse(d.headers.get('Dropbox-API-Result')).rev || rev; } catch {}
        const doc = await d.json();
        const upd = [];
        for (const rec of doc.recs || []) {
          const cur = S.recs.get(rec.id);
          if (!cur || rec.u > cur.u) { S.recs.set(rec.id, rec); upd.push(rec); }
        }
        if (upd.length) await db.putMany('rec', upd);
        got += upd.length;
        await setMeta('rev', rev);
      }
      const dirty = [...S.recs.values()].filter((r) => r.d);
      if (!dirty.length) break;
      const snap = new Map(dirty.map((r) => [r.id, r.u]));
      const doc = { app: 'karteikasten', v: 1, recs: [...S.recs.values()].map(({ d, ...r }) => r) };
      const up = await upload(
        { path: '/data.json', mode: rev ? { '.tag': 'update', update: rev } : 'add', autorename: false, mute: true },
        new TextEncoder().encode(JSON.stringify(doc)));
      if (up.status === 409 && tries < 4 && /conflict/.test(await up.clone().text())) continue; // anderes Gerät war schneller
      if (!up.ok) await fail('Daten hochladen', up);
      await setMeta('rev', (await up.json()).rev);
      const done = [];
      for (const [id, u] of snap) { const cur = S.recs.get(id); if (cur && cur.u === u) { delete cur.d; done.push(cur); } }
      await db.putMany('rec', done);
      break;
    }
    await setMeta('lastSync', Date.now()); await setMeta('lastErr', null);
    if (S.view === 'decks') renderDecks();
    if (S.view === 'settings') renderSettings();
    if (manual) toast(got ? `Synchronisiert (${got} Änderungen geladen)` : 'Synchronisiert');
    prefetchImages();
  } catch (e) {
    if (!(e instanceof DbxError)) await setMeta('lastErr', new Date().toLocaleString('de-DE') + ' · ' + (e.name || '') + ': ' + e.message);
    if (manual) toast('Sync fehlgeschlagen – Details in den Einstellungen', 4500);
    else console.warn(e);
  } finally { S.syncing = false; syncUI(); }
}
async function prefetchImages() {
  const ids = new Set();
  for (const n of all('note')) for (const f of n.f) for (const m of String(f).matchAll(/data-img="([^"]+)"/g)) ids.add(m[1]);
  for (const id of ids) if (!S.imgUrls.has(id) && !(await db.get('img', id))) await imgUrl(id);
}

/* ================= Einstellungen ================= */
async function renderSettings() {
  const last = await getMeta('lastSync');
  const lastErr = await getMeta('lastErr');
  const b = $('#st-body');
  const ret = Math.round((conf().retention || 0.9) * 100);
  const href = S.rt ? '' : await authUrl();
  b.innerHTML = `
    <p class="note" style="text-align:center">Version ${APP_VERSION}</p>
    <h3>Sync iPad ↔ iPhone (Dropbox)</h3>
    ${S.rt ? `
      <p class="note">Verbunden. Die Daten liegen in deiner Dropbox unter <b>Apps › Karteikarten-HeDa</b>.</p>
      <button class="btn primary" id="st-sync">Jetzt synchronisieren</button>
      <p class="note">${last ? 'Zuletzt: ' + new Date(last).toLocaleString('de-DE') : 'Noch nicht synchronisiert.'}</p>
      ${lastErr ? `<p class="note" style="color:var(--danger)">Letzter Fehler:</p><div class="code" id="st-err" style="font-size:13px;letter-spacing:0;text-align:left;overflow-wrap:anywhere">${esc(lastErr)}</div>
      <button class="btn" id="st-errcopy">Fehlerdetails kopieren</button>` : ''}
      <button class="btn danger" id="st-unlink">Dropbox auf diesem Gerät trennen</button>` : `
      <p class="note">Einmal pro Gerät: bei Dropbox anmelden, „Zulassen“ tippen, den angezeigten Code kopieren und hier einfügen.</p>
      <a class="btn primary" href="${href}" target="_blank" rel="noopener">1. Bei Dropbox anmelden</a>
      <label class="lb">2. Code von Dropbox einfügen</label>
      <input id="st-in" placeholder="Code" autocapitalize="off" autocomplete="off" spellcheck="false">
      <button class="btn" id="st-link">3. Verbinden</button>`}
    <h3>Lernen</h3>
    <label class="lb">Ziel-Erinnerungsrate (Anki-Standard: 90 %)</label>
    <div class="row"><input id="st-ret" type="number" inputmode="numeric" min="70" max="97" value="${ret}"><button class="btn" id="st-ret-save" style="margin:0">Übernehmen</button></div>
    <p class="note">Höher = häufigere Wiederholungen. Lernschritte wie in Anki: 1 Min. und 10 Min., Wiederlernen 10 Min., Tageswechsel um 4 Uhr.</p>
    <h3>Datensicherung</h3>
    <button class="btn" id="st-exp">Backup exportieren</button>
    <button class="btn" id="st-imp">Backup importieren</button>
    <input type="file" id="st-file" accept="application/json,.json" hidden>
    <h3>Info</h3>
    <p class="note">Lernalgorithmus: FSRS (ts-fsrs, MIT-Lizenz) – derselbe Algorithmus, den Anki verwendet. Daten liegen auf diesem Gerät und, wenn verbunden, in deiner Dropbox.</p>`;
  const on = (id, f) => { const el = $('#' + id); if (el) el.onclick = f; };
  on('st-sync', () => sync(true));
  on('st-errcopy', async () => { try { await navigator.clipboard.writeText(lastErr); toast('Kopiert'); } catch { toast('Bitte Text markieren und kopieren'); } });
  on('st-unlink', async () => {
    if (!confirm('Dropbox trennen? Deine Karten bleiben auf diesem Gerät.')) return;
    S.rt = S.at = null; await setMeta('rt', null); await setMeta('rev', null); renderSettings();
  });
  on('st-link', async () => {
    const code = $('#st-in').value.trim();
    if (!code) { toast('Bitte zuerst den Code von Dropbox einfügen.'); return; }
    try { await finishAuth(code); } catch (e) { toast(e.message, 4000); return; }
    // beim ersten Verbinden alles hochladen, damit beide Geräte zusammengeführt werden
    for (const r of S.recs.values()) r.d = 1;
    await db.putMany('rec', [...S.recs.values()]);
    for (const im of await db.all('img')) { im.synced = false; await db.put('img', im); S.pendingImg++; }
    await setMeta('rev', null);
    renderSettings(); await sync(true);
  });
  on('st-ret-save', () => {
    const v = Math.min(97, Math.max(70, parseInt($('#st-ret').value, 10) || 90));
    const c = conf(); c.retention = v / 100; save(c); toast('Gespeichert: ' + v + ' %');
  });
  on('st-exp', exportBackup);
  on('st-imp', () => $('#st-file').click());
  $('#st-file').onchange = async (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); };
}
$('#st-back').onclick = () => go('decks');

/* ================= Backup ================= */
const blobToB64 = (b) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
async function exportBackup() {
  toast('Backup wird erstellt …');
  const imgs = [];
  for (const im of await db.all('img')) imgs.push({ id: im.id, data: await blobToB64(im.blob) });
  const data = JSON.stringify({ app: 'karteikasten', v: 1, at: Date.now(), recs: [...S.recs.values()].map(({ d, ...r }) => r), imgs });
  const name = 'karteikasten-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(f) {
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'karteikasten') throw new Error('Keine Karteikasten-Sicherung');
    let n = 0;
    for (const r of j.recs) { const cur = S.recs.get(r.id); if (!cur || r.u > cur.u) { r.d = 1; S.recs.set(r.id, r); n++; } }
    await db.putMany('rec', [...S.recs.values()]);
    for (const im of j.imgs || []) {
      if (await db.get('img', im.id)) continue;
      const b = await (await fetch(im.data)).blob(); await db.put('img', { id: im.id, blob: b, synced: false }); S.pendingImg++;
    }
    toast(`${n} Einträge importiert`); syncUI(); autoSyncSoon(); go('decks');
  } catch (e) { toast('Import fehlgeschlagen: ' + e.message, 4000); }
}

/* ================= Start ================= */
(async function init() {
  try { await db.open(); } catch (e) { document.body.innerHTML = '<p style="padding:24px">Speicher nicht verfügbar (privater Modus?).</p>'; return; }
  for (const r of await db.all('rec')) S.recs.set(r.id, r);
  S.pendingImg = (await db.all('img')).filter((i) => !i.synced).length;
  S.rt = await getMeta('rt');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  go('decks'); syncUI();
  if (S.rt) sync(false);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (Date.now() - hiddenAt > 60e3) {
      if (S.view === 'decks') renderDecks();
      if (S.view === 'review' && !S.shown) nextCard();
      if (S.view !== 'review' || !S.shown) sync(false);
    }
  });
  window.addEventListener('online', () => sync(false));
})();
